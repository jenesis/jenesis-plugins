name: Build Jenesis Plugins

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Fetch Maven Central from its Google Cloud mirror, which spares the runners Central's rate limit,
# and from Central itself for what the mirror has not synced yet: a remote is asked only where
# the one before it answers 404.
env:
  MAVEN_REPOSITORY_URI: https://maven-central.storage-download.googleapis.com/maven2/,https://repo1.maven.org/maven2/

jobs:
  plugins:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: List the plugins
        id: list
        run: echo "plugins=$(ls plugins | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    needs: plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plugins.outputs.plugins) }}
    name: build (${{ matrix.plugin }})

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test the plugin with Jenesis
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          java -Djenesis.dependency.pin=strict build/jenesis/Make.java \
               "+plugins+${PLUGIN}+sources" \
               "+plugins+${PLUGIN}+tests" \
               "+plugins+${PLUGIN}+it"
