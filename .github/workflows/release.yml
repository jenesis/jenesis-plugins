name: Release Jenesis Plugins

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to release; defaults to the head this workflow runs on
        required: false
        type: string
      plugin:
        description: Folder under plugins/ to release alone, harness for the plugin harness, or all to release every plugin and the harness
        required: false
        default: all
        type: string
      tag:
        description: Version to release, vX.Y.Z; defaults to the next minor of the latest tag
        required: false
        type: string

# Route Maven Central through the repository variable MAVEN_REPOSITORY_URI when set
# (the Google Cloud mirror of Central, to avoid Central rate-limiting the runners),
# falling back to Central itself so an unset variable never becomes an empty URI.
# The module build.jenesis is read from Central itself: a release pins the
# build.jenesis just published there, which the mirror and the module index can
# serve hours later.
env:
  MAVEN_REPOSITORY_URI: ${{ vars.MAVEN_REPOSITORY_URI || 'https://repo1.maven.org/maven2/' }}
  JENESIS_REPOSITORY_URI: maven:2:https://repo1.maven.org/maven2/|build.jenesis,https://repo.jenesis.build/

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.sha || github.sha }}
          submodules: recursive

      - name: Resolve release version
        id: version
        env:
          PLUGIN: ${{ inputs.plugin || 'all' }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$PLUGIN" != all ] && [ "$PLUGIN" != harness ] \
              && ! { printf '%s' "$PLUGIN" | grep -qE '^[a-z0-9]+$' && [ -d "plugins/$PLUGIN" ]; }; then
            echo "Plugin '$PLUGIN' is not a folder under plugins/: pass one of them, harness, or all." >&2
            exit 1
          fi
          if [ -n "$TAG" ]; then
            VERSION="$(printf '%s' "$TAG" | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
            if [ -z "$VERSION" ]; then
              echo "Tag '$TAG' is not a release tag: pass vX.Y.Z or X.Y.Z, e.g. v1.2.3." >&2
              exit 1
            fi
          else
            LATEST="$(git tag --list | sed -nE 's/^([a-z0-9]+-)?v?([0-9]+\.[0-9]+\.[0-9]+)$/\2/p' | sort -V | tail -n1)"
            if [ -z "$LATEST" ]; then
              VERSION="0.0.1"
            else
              MAJOR="$(echo "$LATEST" | cut -d. -f1)"
              MINOR="$(echo "$LATEST" | cut -d. -f2)"
              VERSION="${MAJOR}.$((MINOR + 1)).0"
            fi
          fi
          if [ "$PLUGIN" = all ]; then
            RELEASE_TAG="v$VERSION"
            RELEASED='^v?[0-9]+\.[0-9]+\.[0-9]+$'
          else
            RELEASE_TAG="$PLUGIN-v$VERSION"
            RELEASED="^(v?|$PLUGIN-v)[0-9]+\.[0-9]+\.[0-9]+$"
          fi
          PREVIOUS="$( { git tag --list | grep -E "$RELEASED" \
              | sed -E 's/^([a-z0-9]+-)?v?([0-9]+\.[0-9]+\.[0-9]+)$/\2 &/'; echo "$VERSION ~"; } \
              | sort -s -V -k1,1 | sed -n '/ ~$/q;p' | tail -n1 | cut -d' ' -f2)"
          echo "Releasing $PLUGIN at $VERSION as tag $RELEASE_TAG after ${PREVIOUS:-no earlier tag} from $(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and stage artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          java -Djenesis.project.version=${VERSION} \
               -Djenesis.archive.timestamp="$(git log -1 --format=%cI)" \
               -Djenesis.project.sources=true \
               -Djenesis.project.documentation=true \
               -Djenesis.dependency.pin=strict \
               -Djenesis.project.metadata=project.properties \
               build/jenesis/Make.java stage

      - name: Select what is released
        if: steps.version.outputs.plugin != 'all'
        env:
          PLUGIN: ${{ steps.version.outputs.plugin }}
        run: |
          STAGED=target/stage/maven/output/build/jenesis
          if [ ! -d "$STAGED/build.jenesis.plugin.$PLUGIN" ]; then
            echo "Nothing was staged as build.jenesis.plugin.$PLUGIN under $STAGED." >&2
            exit 1
          fi
          find "$STAGED" -mindepth 1 -maxdepth 1 -type d ! -name "build.jenesis.plugin.$PLUGIN" -exec rm -rf {} +
          find target/stage/maven/output -type f | sort

      - name: Tag the released commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: JReleaser deploy
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          version: latest
          arguments: full-release
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PREVIOUS_TAG: ${{ steps.version.outputs.previous }}
          JRELEASER_REPRODUCIBLE: "true"
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jreleaser-logs
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
