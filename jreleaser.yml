project:
  name: jenesis-plugins
  description: The plugins of the Jenesis build tool that run a tool it resolves as a dependency.
  authors: [Rafael Winterhalter]
  license: Apache-2.0
  links:
    homepage: https://github.com/jenesis/jenesis-plugins
  languages:
    java:
      groupId: build.jenesis
      version: '25'

signing:
  active: ALWAYS
  pgp:
    armored: true
    mode: MEMORY

release:
  github:
    owner: jenesis
    name: jenesis-plugins
    branch: main
    branchPush: main
    skipRelease: false
    skipTag: false
    tagName: 'v{{projectVersion}}'

checksum:
  individual: true

