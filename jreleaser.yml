project:
  name: jenesis-plugins
  description: The plugins of the Jenesis build tool that run a tool it resolves as a dependency.
  authors: [Rafael Winterhalter]
  license: Apache-2.0
  links:
    homepage: https://github.com/jenesis/jenesis-plugins
  languages:
    java:
      groupId: build.jenesis
      version: '25'

signing:
  active: ALWAYS
  pgp:
    armored: true
    mode: MEMORY

release:
  github:
    owner: jenesis
    name: jenesis-plugins
    branch: main
    branchPush: main
    skipRelease: false
    skipTag: false
    tagName: 'v{{projectVersion}}'

checksum:
  individual: true

files:
  artifacts:
    - path: 'target/stage/maven/output/build/jenesis/build.jenesis.plugin.antlr/{{projectVersion}}/build.jenesis.plugin.antlr-{{projectVersion}}.jar'
    - path: 'target/stage/maven/output/build/jenesis/build.jenesis.plugin.antlr/{{projectVersion}}/build.jenesis.plugin.antlr-{{projectVersion}}.pom'
    - path: 'target/stage/maven/output/build/jenesis/build.jenesis.plugin.pmd/{{projectVersion}}/build.jenesis.plugin.pmd-{{projectVersion}}.jar'
    - path: 'target/stage/maven/output/build/jenesis/build.jenesis.plugin.pmd/{{projectVersion}}/build.jenesis.plugin.pmd-{{projectVersion}}.pom'
    - path: 'target/stage/maven/output/build/jenesis/build.jenesis.plugin.spotbugs/{{projectVersion}}/build.jenesis.plugin.spotbugs-{{projectVersion}}.jar'
    - path: 'target/stage/maven/output/build/jenesis/build.jenesis.plugin.spotbugs/{{projectVersion}}/build.jenesis.plugin.spotbugs-{{projectVersion}}.pom'

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        applyMavenCentralRules: true
        stagingRepositories:
          - target/stage/maven/output
